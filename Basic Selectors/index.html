<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="master.css">
</head>

<body>
    <h1>Selectors :</h1>
    <img src="image\photo_2026-03-27_13-46-33.jpg" alt="" style="float: right; margin: 5px 800px 0 0;" width="400px" height="510px">
    <h2>1.Using element name :</h2>
    <p style="margin: 0 0 15px 15px;">ElementName {<br>/* code here */<br>}</p>
    <h2>2.Using class name :</h2>
    <p style="margin: 0 0 15px 15px;">.ClassName {<br>/* code here */<br>}</p>
    <h2>3.Using id name :</h2>
    <p style="margin: 0 0 15px 15px;">#IdName {<br>/* code here */<br>}</p>
    <h2>4.Using attribute name :</h2>
    <p style="margin: 0 0 15px 15px;">ElementName[attribute] {<br>/* code here */<br>}</p>
    <h2>5.Select all elements :</h2>
    <p style="margin: 0 0 15px 15px;">*{<br>/* code here */<br>}</p>
    
</body>

</html>
